<style>
:root{
  --bg:#080814;--card:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.12);
  --text:#f2f2ff;--muted:#a3a3c8;
  --p1:#7c3aed;--p2:#ec4899;--p3:#06b6d4;--p4:#f59e0b;--p5:#22c55e;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:
  radial-gradient(700px 500px at 10% -5%, rgba(124,58,237,.35), transparent 60%),
  radial-gradient(600px 500px at 95% 5%, rgba(236,72,153,.28), transparent 60%),
  radial-gradient(700px 600px at 50% 110%, rgba(6,182,212,.22), transparent 60%),var(--bg)}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none}
.blob.b1{width:380px;height:380px;background:var(--p1);top:-120px;left:-100px;animation:float1 18s ease-in-out infinite}
.blob.b2{width:320px;height:320px;background:var(--p2);top:35%;right:-130px;animation:float2 22s ease-in-out infinite}
.blob.b3{width:400px;height:400px;background:var(--p3);bottom:-160px;left:25%;animation:float1 26s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,60px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,80px) scale(1.1)}}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(8,8,20,.65);border-bottom:1px solid var(--stroke)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;color:inherit;text-decoration:none}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 6px 20px rgba(236,72,153,.45);font-size:1.1rem}
.nav-links{display:flex;gap:26px;font-size:.92rem}
.nav-links a{color:var(--muted);text-decoration:none;transition:.25s;position:relative}
.nav-links a:hover{color:#fff}
.btn{display:inline-block;border:none;cursor:pointer;text-decoration:none;padding:12px 24px;border-radius:100px;font-weight:700;font-size:.95rem;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;transition:.3s;box-shadow:0 8px 26px rgba(124,58,237,.45)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(236,72,153,.55)}
.btn.ghost{background:transparent;border:1px solid var(--stroke);box-shadow:none;color:var(--text)}
.btn.ghost:hover{border-color:var(--p2)}
.nav .btn{padding:9px 20px;font-size:.88rem}

.hero{position:relative;text-align:center;padding:90px 0 70px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:100px;border:1px solid var(--stroke);background:var(--card);font-size:.82rem;color:var(--muted);margin-bottom:20px;backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--p5);box-shadow:0 0 12px var(--p5);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
h1{font-size:clamp(2.2rem,6.2vw,4.3rem);line-height:1.06;font-weight:900;letter-spacing:-.035em;margin-bottom:20px}
.grad{background:linear-gradient(90deg,#a78bfa,#ec4899,#06b6d4,#f59e0b,#a78bfa);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hero p.sub{max-width:640px;margin:0 auto 24px;color:var(--muted);font-size:clamp(1rem,2.2vw,1.18rem)}
.updated{font-size:.82rem;color:var(--muted);margin-bottom:28px}
.updated b{color:var(--p5)}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:760px;margin:60px auto 0}
.stat{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:22px 14px;backdrop-filter:blur(10px);transition:.35s}
.stat:hover{transform:translateY(-6px);border-color:rgba(236,72,153,.5)}
.stat b{display:block;font-size:clamp(1.4rem,3.5vw,2rem);font-weight:900;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.8rem;color:var(--muted)}

.float{position:absolute;font-size:2rem;opacity:.85;animation:bob 5s ease-in-out infinite;user-select:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
.f1{top:60px;left:6%}.f2{top:170px;right:8%;font-size:2.6rem}.f3{bottom:120px;left:12%;font-size:2.2rem}.f4{bottom:60px;right:14%}
@media(max-width:820px){.float{display:none}}

.ticker{border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:14px 0;overflow:hidden;white-space:nowrap;background:rgba(255,255,255,.02)}
.ticker-track{display:inline-block;animation:slide 26s linear infinite}
.ticker span{color:var(--muted);font-weight:600;font-size:.92rem;margin:0 22px}
.ticker b{color:#fff}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

section{padding:82px 0}
.head{text-align:center;margin-bottom:52px}
.head .kicker{font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--p2);margin-bottom:12px}
.head h2{font-size:clamp(1.7rem,4.2vw,2.7rem);font-weight:900;letter-spacing:-.03em;margin-bottom:12px}
.head p{color:var(--muted);max-width:600px;margin:0 auto}

/* ===== Автор и опыт ===== */
.author-box{
  display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:linear-gradient(150deg,rgba(124,58,237,.14),rgba(236,72,153,.08));
  border:1px solid var(--stroke);border-radius:24px;padding:clamp(22px,4vw,36px);
  max-width:900px;margin:0 auto;backdrop-filter:blur(10px);
}
.author-avatar{
  width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  font-size:2.6rem;background:linear-gradient(135deg,var(--p1),var(--p2));
  box-shadow:0 12px 32px -8px rgba(236,72,153,.7);flex-shrink:0;
}
.author-info h3{font-size:1.3rem;font-weight:900;margin-bottom:6px;letter-spacing:-.02em}
.author-info .role{color:var(--p3);font-size:.9rem;font-weight:700;margin-bottom:12px}
.author-info p{color:var(--muted);font-size:.94rem;line-height:1.65}
@media(max-width:640px){.author-box{grid-template-columns:1fr;text-align:center;justify-items:center}}

/* ===== Кейсы ===== */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.case{
  background:var(--card);border:1px solid var(--stroke);border-radius:22px;
  padding:26px;backdrop-filter:blur(10px);position:relative;overflow:hidden;
}
.case::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--p5),var(--p3))}
.case-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.case-avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;
  background:linear-gradient(135deg,var(--p4),var(--p5));flex-shrink:0}
.case-head h4{font-size:1.05rem;font-weight:800;margin-bottom:2px}
.case-head .meta{font-size:.78rem;color:var(--muted)}
.case-story{color:var(--muted);font-size:.92rem;margin-bottom:16px}
.case-story b{color:#fff}
.case-result{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);
  border-radius:14px;padding:14px 18px;
}
.case-result .label{font-size:.82rem;color:var(--muted)}
.case-result .amount{font-size:1.4rem;font-weight:900;color:#4ade80}

/* ===== Возрастная навигация ===== */
.age-nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:56px}
.age-nav a{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:18px 28px;border-radius:20px;text-decoration:none;min-width:180px;
  background:var(--card);border:1px solid var(--stroke);color:var(--text);
  transition:.3s;backdrop-filter:blur(10px);
}
.age-nav a:hover{transform:translateY(-6px);border-color:rgba(236,72,153,.6);background:rgba(236,72,153,.08)}
.age-nav .age-emoji{font-size:1.9rem}
.age-nav .age-title{font-weight:800;font-size:1.05rem}
.age-nav .age-sub{font-size:.78rem;color:var(--muted)}

/* ===== Что изменилось ===== */
.changes{
  background:linear-gradient(150deg,rgba(6,182,212,.12),rgba(124,58,237,.1));
  border:1px solid var(--stroke);border-radius:24px;padding:clamp(24px,4vw,40px);
  max-width:900px;margin:0 auto;backdrop-filter:blur(10px);
}
.changes h3{font-size:1.35rem;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.changes ul{list-style:none;display:grid;gap:14px}
.changes li{display:flex;gap:12px;font-size:.94rem;color:var(--muted)}
.changes li b{color:#fff}
.changes li::before{content:'→';color:var(--p3);font-weight:900;flex-shrink:0}

/* ===== Сетка карточек ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:20px}
.card{
  position:relative;background:var(--card);border:1px solid var(--stroke);
  border-radius:22px;padding:26px 22px;backdrop-filter:blur(10px);
  transition:.4s cubic-bezier(.2,.8,.3,1);overflow:hidden;
}
.card::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.4s}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-8px);background:rgba(255,255,255,.08)}
.card .ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:16px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 24px -6px var(--c2)}
.card h3{font-size:1.12rem;font-weight:800;margin-bottom:8px}
.card p{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.money{display:inline-block;font-weight:800;font-size:.84rem;padding:6px 13px;border-radius:100px;
  background:rgba(34,197,94,.13);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.money.mid{background:rgba(245,158,11,.13);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.money.top{background:rgba(236,72,153,.13);color:#f472b6;border-color:rgba(236,72,153,.3)}

/* ===== Шаги ===== */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;counter-reset:s;list-style:none}
.step{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:20px;
  padding:30px 22px 24px;backdrop-filter:blur(10px);transition:.35s}
.step:hover{transform:translateY(-6px);border-color:rgba(124,58,237,.55)}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-18px;left:22px;
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.1rem;color:#fff;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 10px 24px -6px rgba(124,58,237,.8)}
.step h3{margin:14px 0 8px;font-size:1.02rem;font-weight:800}
.step p{color:var(--muted);font-size:.88rem}

/* ===== Калькулятор ===== */
.calc{background:linear-gradient(150deg,rgba(124,58,237,.16),rgba(236,72,153,.1));
  border:1px solid var(--stroke);border-radius:28px;padding:clamp(24px,4vw,44px);backdrop-filter:blur(12px)}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
@media(max-width:760px){.calc-grid{grid-template-columns:1fr;gap:26px}}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.pill{padding:9px 16px;border-radius:100px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);
  color:var(--muted);cursor:pointer;font-size:.86rem;font-weight:600;transition:.25s;font-family:inherit}
.pill:hover{color:#fff;border-color:rgba(236,72,153,.6)}
.pill.active{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;
  box-shadow:0 6px 20px -4px rgba(236,72,153,.7)}
.slider-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.slider-row b{color:#fff;font-size:1.15rem}
input[type=range]{width:100%;height:8px;border-radius:100px;appearance:none;
  background:linear-gradient(90deg,var(--p1),var(--p2));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:4px solid var(--p2);cursor:grab;box-shadow:0 0 0 6px rgba(236,72,153,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--p2)}
.result{text-align:center;background:rgba(8,8,20,.55);border:1px solid var(--stroke);border-radius:22px;padding:34px 22px}
.result .label{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.result .num{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(135deg,#4ade80,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent;transition:.3s}
.result .per{color:var(--muted);font-size:.88rem;margin-top:8px}

/* ===== Безопасность ===== */
.safe{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.safe-item{display:flex;gap:16px;padding:20px;border-radius:18px;background:var(--card);
  border:1px solid var(--stroke);transition:.3s}
.safe-item:hover{border-color:rgba(245,158,11,.5);transform:translateX(6px)}
.safe-item .em{font-size:1.5rem;flex-shrink:0}
.safe-item h3{font-size:.98rem;font-weight:800;margin-bottom:5px}
.safe-item p{font-size:.86rem;color:var(--muted)}

/* ===== FAQ ===== */
.faq{max-width:780px;margin:0 auto}
details{background:var(--card);border:1px solid var(--stroke);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:.3s}
details[open]{border-color:rgba(124,58,237,.55);background:rgba(124,58,237,.08)}
summary{padding:18px 22px;cursor:pointer;font-weight:700;font-size:.98rem;
  display:flex;justify-content:space-between;align-items:center;gap:16px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:1.5rem;font-weight:400;color:var(--p2);transition:.3s;flex-shrink:0;line-height:1}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 22px 20px;color:var(--muted);font-size:.9rem}

/* ===== CTA ===== */
.cta{text-align:center;border-radius:32px;padding:clamp(40px,7vw,72px) 24px;
  background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(236,72,153,.22),rgba(6,182,212,.18));
  border:1px solid var(--stroke);position:relative;overflow:hidden}
.cta h2{font-size:clamp(1.6rem,4.4vw,2.6rem);font-weight:900;letter-spacing:-.03em;margin-bottom:14px}
.cta p{color:var(--muted);max-width:520px;margin:0 auto 30px}

footer{border-top:1px solid var(--stroke);padding:36px 0;text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}
footer .logo{justify-content:center;margin-bottom:12px;color:#fff}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:#fff}

.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.3,1)}
.reveal.visible{opacity:1;transform:none}

@media(max-width:700px){
  .nav-links{display:none}
  .stats{grid-template-columns:1fr;max-width:340px}
  section{padding:60px 0}
}
</style>
